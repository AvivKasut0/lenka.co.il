<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lenka pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05060f; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // ── CONFIG ────────────────────────────────────
  const PLAYER_IMG = '../images/dvirbride.png';

  // ── constants ─────────────────────────────────
  const PW         = 14;    // AI paddle width  (px)
  const PH         = 100;   // paddle height (px)
  const IMG_W      = 55;    // player image width
  const IMG_H      = 115;   // player image height
  const BR         = 9;     // ball radius   (px)
  const BALL_SPEED = 3.5;
  const AI_SPEED   = 2.6;

  // ── setup ─────────────────────────────────────
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');

  const playerImg = new Image();
  playerImg.src = PLAYER_IMG;

  let W, H;
  let state;           // 'waiting' | 'playing' | 'scored'
  let ball;
  let leftY, rightY;
  let scoreL, scoreR;
  const keys = {};

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  // AI is left, player is right
  function lx() { return 20; }
  function rx() { return W - 20 - IMG_W; }
  function clampAI(y)     { return Math.max(0, Math.min(H - PH, y)); }
  function clampPlayer(y) { return Math.max(0, Math.min(H - IMG_H, y)); }

  function newBall(goRight = true) {
    const angle = (Math.random() * 0.8 - 0.4);
    ball = {
      x:  W / 2,
      y:  H / 2,
      vx: (goRight ? 1 : -1) * BALL_SPEED * Math.cos(angle),
      vy: BALL_SPEED * Math.sin(angle),
    };
  }

  function resetGame() {
    leftY  = H / 2 - PH / 2;
    rightY = H / 2 - IMG_H / 2;
    scoreL = 0;
    scoreR = 0;
    newBall(true);
    state = 'waiting';
  }

  // ── input ─────────────────────────────────────
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (state === 'waiting') state = 'playing';
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  // mouse controls RIGHT (player) paddle
  window.addEventListener('mousemove', e => {
    if (state === 'playing') rightY = clampPlayer(e.clientY - IMG_H / 2);
  });

  window.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.touches) {
      rightY = clampPlayer(t.clientY - IMG_H / 2);
    }
  }, { passive: false });

  window.addEventListener('touchstart', () => {
    if (state === 'waiting') state = 'playing';
  });

  window.addEventListener('resize', () => { resize(); resetGame(); });

  // ── update ────────────────────────────────────
  function update() {
    if (state !== 'playing') return;

    // keyboard — player is on the RIGHT
    if (keys['ArrowUp']   || keys['w'] || keys['W']) rightY = clampPlayer(rightY - 7);
    if (keys['ArrowDown'] || keys['s'] || keys['S']) rightY = clampPlayer(rightY + 7);

    // AI on the LEFT — tracks ball with speed cap
    const aiTarget = ball.y - PH / 2;
    const diff = aiTarget - leftY;
    leftY = clampAI(leftY + Math.sign(diff) * Math.min(Math.abs(diff), AI_SPEED));

    // move ball
    ball.x += ball.vx;
    ball.y += ball.vy;

    // top / bottom walls
    if (ball.y - BR <= 0)  { ball.y = BR;     ball.vy =  Math.abs(ball.vy); }
    if (ball.y + BR >= H)  { ball.y = H - BR; ball.vy = -Math.abs(ball.vy); }

    // left paddle hit (AI — plain rect)
    if (
      ball.vx < 0 &&
      ball.x - BR <= lx() + PW &&
      ball.x + BR >= lx() &&
      ball.y + BR >= leftY &&
      ball.y - BR <= leftY + PH
    ) {
      ball.x = lx() + PW + BR;
      const rel   = (ball.y - (leftY + PH / 2)) / (PH / 2);
      const spd   = Math.min(Math.hypot(ball.vx, ball.vy) + 0.2, 14);
      const angle = rel * 0.85;
      ball.vx =  spd * Math.cos(angle);
      ball.vy =  spd * Math.sin(angle);
    }

    // right paddle hit (player — image)
    if (
      ball.vx > 0 &&
      ball.x + BR >= rx() &&
      ball.x - BR <= rx() + IMG_W &&
      ball.y + BR >= rightY &&
      ball.y - BR <= rightY + IMG_H
    ) {
      ball.x = rx() - BR;
      const rel   = (ball.y - (rightY + IMG_H / 2)) / (IMG_H / 2);
      const spd   = Math.min(Math.hypot(ball.vx, ball.vy) + 0.2, 14);
      const angle = rel * 0.85;
      ball.vx = -spd * Math.cos(angle);
      ball.vy =  spd * Math.sin(angle);
    }

    // scoring
    if (ball.x < -BR * 2) {
      scoreR++;          // AI missed → player (right) scores
      scored(false);
    }
    if (ball.x > W + BR * 2) {
      scoreL++;          // player missed → AI (left) scores
      scored(true);
    }
  }

  function scored(serveLeft) {
    state = 'scored';
    setTimeout(() => { newBall(serveLeft); state = 'playing'; }, 900);
  }

  // ── draw ──────────────────────────────────────
  function drawAIPaddle(x, y) {
    // glowing white rect
    ctx.save();
    ctx.shadowColor = 'rgba(180,200,255,0.7)';
    ctx.shadowBlur  = 14;
    ctx.fillStyle   = 'rgba(210,220,255,0.9)';
    ctx.beginPath();
    ctx.roundRect(x, y, PW, PH, 4);
    ctx.fill();
    ctx.restore();
  }

  function drawPlayerPaddle(x, y) {
    if (playerImg.naturalWidth) {
      ctx.save();
      ctx.shadowColor = 'rgba(255,255,255,0.35)';
      ctx.shadowBlur  = 18;
      // mirror so it faces left (inward)
      ctx.translate(x + IMG_W, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(playerImg, 0, y, IMG_W, IMG_H);
      ctx.restore();
    } else {
      ctx.fillStyle = '#fff';
      ctx.fillRect(x, y, IMG_W, IMG_H);
    }
  }

  function draw() {
    // dark background with very subtle gradient
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, '#05060f');
    grad.addColorStop(1, '#0b0d1a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // centre line
    ctx.save();
    ctx.setLineDash([6, 16]);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.restore();

    // paddles
    drawAIPaddle(lx(), leftY);
    drawPlayerPaddle(rx(), rightY);

    // ball with glow
    ctx.save();
    ctx.shadowColor = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur  = 22;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BR, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.restore();

    // score — AI on left, player on right
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText(`${scoreL}  —  ${scoreR}`, W / 2, 46);

    // start hint
    if (state === 'waiting') {
      ctx.font = '13px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillText('move mouse · arrow keys · tap to start', W / 2, H / 2 + IMG_H);
    }
  }

  // ── loop ──────────────────────────────────────
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  resetGame();
  loop();
</script>
</body>
</html>
