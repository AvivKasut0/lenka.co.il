<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lenka pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // ── CONFIG — keep in sync with ../index.html ──
  const IMAGES = [
    '../images/dvirbride.png',
    '../images/dvirkiss.png',
    // '../images/nextimage.png',
  ];

  // ── constants ─────────────────────────────────
  const PW         = 55;   // paddle width  (px)
  const PH         = 115;  // paddle height (px)
  const BR         = 10;   // ball radius   (px)
  const BALL_SPEED = 5.5;
  const AI_SPEED   = 4.2;

  // ── setup ─────────────────────────────────────
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');

  const imgs = IMAGES.map(src => {
    const i = new Image();
    i.src = src;
    return i;
  });

  let W, H;
  let state;           // 'waiting' | 'playing' | 'scored'
  let ball;
  let leftY, rightY;
  let scoreL, scoreR;
  const keys = {};

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function lx() { return 20; }
  function rx() { return W - 20 - PW; }
  function clamp(y) { return Math.max(0, Math.min(H - PH, y)); }

  function newBall(goRight = true) {
    const angle = (Math.random() * 0.8 - 0.4);
    ball = {
      x:  W / 2,
      y:  H / 2,
      vx: (goRight ? 1 : -1) * BALL_SPEED * Math.cos(angle),
      vy: BALL_SPEED * Math.sin(angle),
    };
  }

  function resetGame() {
    leftY  = H / 2 - PH / 2;
    rightY = H / 2 - PH / 2;
    scoreL = 0;
    scoreR = 0;
    newBall(true);
    state = 'waiting';
  }

  // ── input ─────────────────────────────────────
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (state === 'waiting') state = 'playing';
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  window.addEventListener('mousemove', e => {
    if (state === 'playing') leftY = clamp(e.clientY - PH / 2);
  });

  window.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.touches) {
      if (t.clientX < W / 2) leftY = clamp(t.clientY - PH / 2);
    }
  }, { passive: false });

  window.addEventListener('touchstart', () => {
    if (state === 'waiting') state = 'playing';
  });

  window.addEventListener('resize', () => { resize(); resetGame(); });

  // ── update ────────────────────────────────────
  function update() {
    if (state !== 'playing') return;

    // keyboard paddle
    if (keys['ArrowUp']   || keys['w'] || keys['W']) leftY = clamp(leftY - 7);
    if (keys['ArrowDown'] || keys['s'] || keys['S']) leftY = clamp(leftY + 7);

    // AI paddle — tracks ball with speed cap + tiny error band
    const aiTarget = ball.y - PH / 2;
    const diff = aiTarget - rightY;
    rightY = clamp(rightY + Math.sign(diff) * Math.min(Math.abs(diff), AI_SPEED));

    // move ball
    ball.x += ball.vx;
    ball.y += ball.vy;

    // top / bottom
    if (ball.y - BR <= 0)  { ball.y = BR;     ball.vy =  Math.abs(ball.vy); }
    if (ball.y + BR >= H)  { ball.y = H - BR; ball.vy = -Math.abs(ball.vy); }

    // left paddle hit
    if (
      ball.vx < 0 &&
      ball.x - BR <= lx() + PW &&
      ball.x + BR >= lx() &&
      ball.y + BR >= leftY &&
      ball.y - BR <= leftY + PH
    ) {
      ball.x = lx() + PW + BR;
      const rel   = (ball.y - (leftY  + PH / 2)) / (PH / 2);
      const spd   = Math.min(Math.hypot(ball.vx, ball.vy) + 0.3, 18);
      const angle = rel * 0.85;
      ball.vx =  spd * Math.cos(angle);
      ball.vy =  spd * Math.sin(angle);
    }

    // right paddle hit
    if (
      ball.vx > 0 &&
      ball.x + BR >= rx() &&
      ball.x - BR <= rx() + PW &&
      ball.y + BR >= rightY &&
      ball.y - BR <= rightY + PH
    ) {
      ball.x = rx() - BR;
      const rel   = (ball.y - (rightY + PH / 2)) / (PH / 2);
      const spd   = Math.min(Math.hypot(ball.vx, ball.vy) + 0.3, 18);
      const angle = rel * 0.85;
      ball.vx = -spd * Math.cos(angle);
      ball.vy =  spd * Math.sin(angle);
    }

    // scoring
    if (ball.x < -BR * 2) {
      scoreR++;
      scored(false);
    }
    if (ball.x > W + BR * 2) {
      scoreL++;
      scored(true);
    }
  }

  function scored(serveLeft) {
    state = 'scored';
    setTimeout(() => { newBall(serveLeft); state = 'playing'; }, 900);
  }

  // ── draw ──────────────────────────────────────
  function drawPaddle(imgIdx, x, y, mirror) {
    const img = imgs[imgIdx] ?? imgs[0];
    if (img?.naturalWidth) {
      ctx.save();
      if (mirror) {
        ctx.translate(x + PW, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(img, 0, y, PW, PH);
      } else {
        ctx.drawImage(img, x, y, PW, PH);
      }
      ctx.restore();
    } else {
      ctx.fillStyle = '#fff';
      ctx.fillRect(x, y, PW, PH);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // centre line
    ctx.save();
    ctx.setLineDash([8, 14]);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.restore();

    // paddles — each image faces inward (right paddle mirrored)
    drawPaddle(0, lx(), leftY,  false);
    drawPaddle(Math.min(1, imgs.length - 1), rx(), rightY, true);

    // ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BR, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // score
    ctx.font = 'bold 26px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.textAlign = 'center';
    ctx.fillText(`${scoreL}  —  ${scoreR}`, W / 2, 42);

    // start / intermission hint
    if (state === 'waiting') {
      ctx.font = '12px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillText('press any key · tap to start', W / 2, H / 2 + PH);
    }
  }

  // ── loop ──────────────────────────────────────
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  resetGame();
  loop();
</script>
</body>
</html>
