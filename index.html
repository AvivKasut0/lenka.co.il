<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lenka.co.il</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #img {
      position: fixed;
      height: 28vh;
      width: auto;
      pointer-events: none;
      user-select: none;
    }
    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #counter {
      position: fixed;
      bottom: 1.2rem;
      width: 100%;
      text-align: center;
      font: 0.65rem/1 'Courier New', monospace;
      color: rgba(255,255,255,0.66);
      letter-spacing: 0.12em;
      pointer-events: none;
      user-select: none;
    }
    @keyframes pulse { 0%,100%{opacity:.66} 50%{opacity:.88} }
    #counter { animation: pulse 3s ease-in-out infinite; }
    #pong-link {
      position: fixed;
      bottom: 3rem;
      width: 100%;
      text-align: center;
      font: 0.7rem/1 'Courier New', monospace;
      letter-spacing: 0.18em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }
    #pong-link.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #pong-link a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
    }
    #pong-link a:hover { color: #fff; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    #pong-link.visible { animation: blink 1.6s ease-in-out 3; }
  </style>
</head>
<body>

<canvas id="confetti"></canvas>
<div id="counter"></div>
<div id="pong-link"><a href="/pong">▶ /pong</a></div>
<img id="img" src="dvirbride.png" draggable="false">

<script>
  // ── CONFIG ───────────────────────────────────
  const IMAGES = ['images/dvirbride.png', 'images/dvirkiss.png'];

  const img    = document.getElementById('img');
  img.src      = IMAGES[Math.floor(Math.random() * IMAGES.length)];
  const canvas = document.getElementById('confetti');
  const ctx    = canvas.getContext('2d');

  const COLORS = [
    '#ff003c','#ff6600','#ffe600',
    '#00ff99','#00cfff','#aa00ff',
    '#ff00cc','#ffffff',
  ];

  let color = randomColor();
  function randomColor(avoid) {
    let c;
    do { c = COLORS[Math.floor(Math.random() * COLORS.length)]; } while (c === avoid);
    return c;
  }

  function applyColor(c) {
    img.style.filter = `drop-shadow(0 0 18px ${c}) hue-rotate(${hueFor(c)}deg) saturate(2)`;
  }

  // cheap hue map so the image tints toward the accent color
  function hueFor(hex) {
    const map = {
      '#ff003c': 0,   '#ff6600': 25,  '#ffe600': 50,
      '#00ff99': 145, '#00cfff': 195, '#aa00ff': 275,
      '#ff00cc': 310, '#ffffff': 0,
    };
    return map[hex] ?? 0;
  }

  // ── state ────────────────────────────────────
  let x, y, dx, dy;

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function start() {
    x  = (window.innerWidth  - img.offsetWidth)  * 0.3;
    y  = (window.innerHeight - img.offsetHeight) * 0.2;
    dx = 1;
    dy = 1;
    applyColor(color);
    requestAnimationFrame(tick);
  }

  if (img.complete && img.naturalWidth) {
    start();
  } else {
    img.onload = start;
  }

  // ── confetti particles ────────────────────────
  const particles = [];

  function burst(cx, cy) {
    const count = 120;
    for (let i = 0; i < count; i++) {
      const angle  = Math.random() * Math.PI * 2;
      const speed  = 4 + Math.random() * 9;
      const size   = 6 + Math.random() * 8;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3,
        w: size, h: size * (0.4 + Math.random() * 0.4),
        rot: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.3,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        life: 1,
        decay: 0.006 + Math.random() * 0.01,
        gravity: 0.25 + Math.random() * 0.15,
      });
    }
  }

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x   += p.vx;
      p.y   += p.vy;
      p.vy  += p.gravity;
      p.vx  *= 0.98;
      p.rot += p.spin;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }

      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
  }

  // ── main loop ────────────────────────────────
  const CORNER_MARGIN = 8; // px — how close counts as a corner hit

  function tick() {
    const W = window.innerWidth  - img.offsetWidth;
    const H = window.innerHeight - img.offsetHeight;

    x += dx;
    y += dy;

    let hitX = false, hitY = false;

    if (x <= 0)    { x = 0;  dx =  Math.abs(dx); hitX = true; }
    if (x >= W)    { x = W;  dx = -Math.abs(dx); hitX = true; }
    if (y <= 0)    { y = 0;  dy =  Math.abs(dy); hitY = true; }
    if (y >= H)    { y = H;  dy = -Math.abs(dy); hitY = true; }

    if (hitX || hitY) {
      color = randomColor(color);
      applyColor(color);

      if (hitX && hitY) {
        // corner hit — confetti + unlock pong
        burst(x + img.offsetWidth / 2, y + img.offsetHeight / 2);
        unlock();
      }
    }

    img.style.left = x + 'px';
    img.style.top  = y + 'px';

    drawParticles();
    requestAnimationFrame(tick);
  }
  // ── pong unlock ──────────────────────────────
  const pongLink = document.getElementById('pong-link');
  let unlocked = false;

  function unlock() {
    if (unlocked) return;
    unlocked = true;
    pongLink.classList.add('visible');
  }

  // Konami code: ↑↑↓↓←→←→BA
  const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let konamiPos = 0;
  window.addEventListener('keydown', e => {
    if (e.key === KONAMI[konamiPos]) {
      konamiPos++;
      if (konamiPos === KONAMI.length) { unlock(); konamiPos = 0; }
    } else {
      konamiPos = e.key === KONAMI[0] ? 1 : 0;
    }
  });

  // ── live viewer counter ──────────────────────
  {
    const counterEl = document.getElementById('counter');
    let current = Math.floor(Math.random() * 18) + 4; // start 4–21

    function render() {
      counterEl.textContent = `● ${current} viewing now`;
    }

    function nudge() {
      // weighted random walk — small steps most of the time
      const roll = Math.random();
      if (roll < 0.55)      current += 1;
      else if (roll < 0.85) current -= 1;
      else if (roll < 0.93) current += 2;
      else if (roll < 0.98) current -= 2;
      else                  current += (Math.random() < 0.5 ? 3 : -3);

      current = Math.max(1, Math.min(38, current));
      render();

      // next update in 2.5–7 s
      setTimeout(nudge, 2500 + Math.random() * 4500);
    }

    render();
    setTimeout(nudge, 2500 + Math.random() * 4500);
  }
</script>
</body>
</html>
