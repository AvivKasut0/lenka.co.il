<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lenka.co.il</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #img {
      position: fixed;
      height: 28vh;
      width: auto;
      pointer-events: none;
      user-select: none;
    }
    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

<canvas id="confetti"></canvas>
<img id="img" src="dvirbride.png" draggable="false">

<script>
  // ── CONFIG ───────────────────────────────────
  const IMAGES = ['images/dvirbride.png', 'images/dvirkiss.png'];

  const img    = document.getElementById('img');
  img.src      = IMAGES[Math.floor(Math.random() * IMAGES.length)];
  const canvas = document.getElementById('confetti');
  const ctx    = canvas.getContext('2d');

  const COLORS = [
    '#ff003c','#ff6600','#ffe600',
    '#00ff99','#00cfff','#aa00ff',
    '#ff00cc','#ffffff',
  ];

  let color = randomColor();
  function randomColor(avoid) {
    let c;
    do { c = COLORS[Math.floor(Math.random() * COLORS.length)]; } while (c === avoid);
    return c;
  }

  function applyColor(c) {
    img.style.filter = `drop-shadow(0 0 18px ${c}) hue-rotate(${hueFor(c)}deg) saturate(2)`;
  }

  // cheap hue map so the image tints toward the accent color
  function hueFor(hex) {
    const map = {
      '#ff003c': 0,   '#ff6600': 25,  '#ffe600': 50,
      '#00ff99': 145, '#00cfff': 195, '#aa00ff': 275,
      '#ff00cc': 310, '#ffffff': 0,
    };
    return map[hex] ?? 0;
  }

  // ── state ────────────────────────────────────
  let x, y, dx, dy;

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function start() {
    x  = (window.innerWidth  - img.offsetWidth)  * 0.3;
    y  = (window.innerHeight - img.offsetHeight) * 0.2;
    dx = 3.2;
    dy = 2.5;
    applyColor(color);
    requestAnimationFrame(tick);
  }

  if (img.complete && img.naturalWidth) {
    start();
  } else {
    img.onload = start;
  }

  // ── confetti particles ────────────────────────
  const particles = [];

  function burst(cx, cy) {
    const count = 120;
    for (let i = 0; i < count; i++) {
      const angle  = Math.random() * Math.PI * 2;
      const speed  = 4 + Math.random() * 9;
      const size   = 6 + Math.random() * 8;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3,
        w: size, h: size * (0.4 + Math.random() * 0.4),
        rot: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.3,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        life: 1,
        decay: 0.006 + Math.random() * 0.01,
        gravity: 0.25 + Math.random() * 0.15,
      });
    }
  }

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x   += p.vx;
      p.y   += p.vy;
      p.vy  += p.gravity;
      p.vx  *= 0.98;
      p.rot += p.spin;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }

      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
  }

  // ── main loop ────────────────────────────────
  const CORNER_MARGIN = 8; // px — how close counts as a corner hit

  function tick() {
    const W = window.innerWidth  - img.offsetWidth;
    const H = window.innerHeight - img.offsetHeight;

    x += dx;
    y += dy;

    let hitX = false, hitY = false;

    if (x <= 0)    { x = 0;  dx =  Math.abs(dx); hitX = true; }
    if (x >= W)    { x = W;  dx = -Math.abs(dx); hitX = true; }
    if (y <= 0)    { y = 0;  dy =  Math.abs(dy); hitY = true; }
    if (y >= H)    { y = H;  dy = -Math.abs(dy); hitY = true; }

    if (hitX || hitY) {
      color = randomColor(color);
      applyColor(color);

      if (hitX && hitY) {
        // corner hit — confetti from center of image
        burst(x + img.offsetWidth / 2, y + img.offsetHeight / 2);
      }
    }

    img.style.left = x + 'px';
    img.style.top  = y + 'px';

    drawParticles();
    requestAnimationFrame(tick);
  }
</script>
</body>
</html>
